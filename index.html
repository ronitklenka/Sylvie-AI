
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Sylvie AI - Your multilingual AI companion.">

<title>Sylvie AI</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #000;
  --panel: #111;
  --panel2: #1b1b1b;
  --text: #fff;
  --muted: #aaa;
  --border: #303030;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  height: 100dvh;
  width: 100%;
}

/* SIDEBAR */

.sidebar {
  width: 280px;
  background: #101010;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 15px;
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 20;
  transform: translateX(-100%);
  transition: transform .25s ease;
}

.sidebar.open {
  transform: translateX(0);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 4px 20px;
}

.brand img {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  object-fit: cover;
  background: #222;
}

.brand-name {
  font-size: 19px;
  font-weight: bold;
}

.new-chat {
  background: white;
  color: black;
  border: none;
  padding: 13px;
  border-radius: 10px;
  font-weight: bold;
  margin-bottom: 12px;
}

.search {
  background: #202020;
  color: white;
  border: 1px solid #333;
  border-radius: 9px;
  padding: 12px;
  width: 100%;
  outline: none;
  margin-bottom: 15px;
}

.history-heading {
  color: #999;
  font-size: 12px;
  margin: 10px 4px;
  text-transform: uppercase;
}

.history {
  overflow-y: auto;
  flex: 1;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 4px;
}

.chat-item.active,
.chat-item:hover {
  background: #252525;
}

.chat-title {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 14px;
  cursor: pointer;
}

.chat-actions {
  display: flex;
  gap: 5px;
}

.chat-actions button {
  background: transparent;
  color: #aaa;
  border: none;
  padding: 4px;
}

.chat-actions button:hover {
  color: white;
}

.sidebar-footer {
  border-top: 1px solid #333;
  padding-top: 12px;
  color: #999;
  font-size: 12px;
}

/* MAIN */

.main {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 60px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 15px;
  gap: 13px;
  flex-shrink: 0;
}

.menu-btn {
  background: transparent;
  color: white;
  border: none;
  font-size: 24px;
}

.top-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: bold;
}

.top-brand img {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  object-fit: cover;
}

.language {
  margin-left: auto;
  background: #171717;
  color: white;
  border: 1px solid #444;
  padding: 8px;
  border-radius: 8px;
  max-width: 115px;
}

/* CHAT AREA */

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 15px 25px;
  scroll-behavior: smooth;
}

.messages {
  max-width: 780px;
  margin: auto;
}

.welcome {
  min-height: 65vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.welcome img {
  width: 75px;
  height: 75px;
  border-radius: 22px;
  margin-bottom: 20px;
  object-fit: cover;
}

.welcome h1 {
  font-size: 27px;
  margin: 5px 0;
}

.welcome p {
  color: #999;
  line-height: 1.6;
  max-width: 350px;
}

.message {
  margin: 20px 0;
  display: flex;
  flex-direction: column;
}

.message.user {
  align-items: flex-end;
}

.bubble {
  max-width: 88%;
  padding: 13px 16px;
  border-radius: 16px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .bubble {
  background: #eee;
  color: #000;
  border-bottom-right-radius: 4px;
}

.assistant .bubble {
  background: #171717;
  color: white;
  border: 1px solid #303030;
  border-bottom-left-radius: 4px;
}

.message-tools {
  display: flex;
  gap: 10px;
  margin-top: 7px;
}

.message-tools button {
  color: #999;
  background: transparent;
  border: none;
  font-size: 12px;
  padding: 4px;
}

.message-tools button:hover {
  color: white;
}

.typing {
  color: #aaa;
  padding: 12px;
}

/* INPUT */

.composer-area {
  padding: 10px 15px calc(12px + env(safe-area-inset-bottom));
  background: #000;
}

.composer {
  max-width: 780px;
  margin: auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: #171717;
  border: 1px solid #444;
  border-radius: 16px;
  padding: 8px;
}

.composer textarea {
  flex: 1;
  min-width: 0;
  max-height: 140px;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  padding: 10px;
  font-size: 15px;
}

.send-btn {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: none;
  border-radius: 12px;
  background: white;
  color: black;
  font-size: 20px;
  font-weight: bold;
}

.send-btn:disabled {
  opacity: .4;
}

.disclaimer {
  color: #777;
  text-align: center;
  font-size: 11px;
  margin-top: 9px;
}

/* MOBILE OVERLAY */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 15;
}

.overlay.show {
  display: block;
}

@media (min-width: 800px) {
  .sidebar {
    position: relative;
    transform: none;
    flex-shrink: 0;
  }

  .overlay {
    display: none !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <img src="./icon-192.png" alt="Sylvie AI logo"
           onerror="this.style.display='none'">
      <span class="brand-name">Sylvie AI</span>
    </div>

    <button class="new-chat" id="newChatBtn">
      + New Chat
    </button>

    <input
      class="search"
      id="searchInput"
      placeholder="Search conversations..."
      type="search"
    >

    <div class="history-heading">Your conversations</div>

    <div class="history" id="historyList"></div>

    <div class="sidebar-footer">
      Sylvie AI · Your AI companion
    </div>

  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">

    <header class="topbar">

      <button class="menu-btn" id="menuBtn"
              aria-label="Open menu">☰</button>

      <div class="top-brand">
        <img src="./icon-192.png" alt=""
             onerror="this.style.display='none'">
        <span>Sylvie AI</span>
      </div>

      <select class="language" id="languageSelect"
              aria-label="Conversation language">
        <option value="auto">Auto language</option>
        <option value="English">English</option>
        <option value="Hindi">हिन्दी</option>
        <option value="Odia">ଓଡ଼ିଆ</option>
      </select>

    </header>

    <section class="chat-area" id="chatArea">

      <div class="messages" id="messages">

        <div class="welcome" id="welcome">
          <img src="./icon-192.png" alt="Sylvie AI"
               onerror="this.style.display='none'">

          <h1>What can I help with?</h1>

          <p>
            Ask Sylvie anything. You can chat in English,
            Hindi, or Odia.
          </p>
        </div>

      </div>

    </section>

    <footer class="composer-area">

      <div class="composer">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message Sylvie..."
          aria-label="Message Sylvie"
        ></textarea>

        <button class="send-btn" id="sendBtn"
                aria-label="Send message">↑</button>

      </div>

      <div class="disclaimer">
        Sylvie AI can make mistakes. Check important information.
      </div>

    </footer>

  </main>

</div>

<script>
"use strict";

/* YOUR CLOUDFLARE BACKEND */

const API =
  "https://sylvie-ai-backend.ronitklenka.workers.dev";

/* APP STORAGE */

const STORAGE_KEY = "sylvie_ai_chats_v2";

let chats = [];
let currentChatId = null;
let isSending = false;

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const messages = document.getElementById("messages");
const historyList = document.getElementById("historyList");
const chatArea = document.getElementById("chatArea");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const searchInput = document.getElementById("searchInput");
const languageSelect = document.getElementById("languageSelect");

/* LOAD SAVED CHATS */

function loadChats() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    chats = saved ? JSON.parse(saved) : [];

    if (!Array.isArray(chats)) chats = [];
  } catch (error) {
    chats = [];
  }

  if (chats.length === 0) {
    createChat();
  } else {
    currentChatId = chats[0].id;
    render();
  }
}

function saveChats() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}

function currentChat() {
  return chats.find(chat => chat.id === currentChatId);
}

/* NEW CHAT */

function createChat() {
  const chat = {
    id: Date.now().toString(),
    title: "New conversation",
    messages: [],
    updated: Date.now()
  };

  chats.unshift(chat);
  currentChatId = chat.id;

  saveChats();
  render();

  closeSidebar();
  messageInput.focus();
}

/* SWITCH CHAT */

function switchChat(id) {
  currentChatId = id;
  render();
  closeSidebar();
}

/* DELETE CHAT */

function deleteChat(id) {
  const confirmed = confirm("Delete this conversation?");
  if (!confirmed) return;

  chats = chats.filter(chat => chat.id !== id);

  if (currentChatId === id) {
    if (chats.length > 0) {
      currentChatId = chats[0].id;
    } else {
      createChat();
      return;
    }
  }

  saveChats();
  render();
}

/* RENAME CHAT */

function renameChat(id) {
  const chat = chats.find(item => item.id === id);
  if (!chat) return;

  const newTitle = prompt("Enter conversation name:", chat.title);

  if (newTitle && newTitle.trim()) {
    chat.title = newTitle.trim();
    saveChats();
    render();
  }
}

/* SIDEBAR */

function openSidebar() {
  sidebar.classList.add("open");

  if (window.innerWidth < 800) {
    overlay.classList.add("show");
  }
}

function closeSidebar() {
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

document.getElementById("menuBtn").addEventListener(
  "click", openSidebar
);

overlay.addEventListener("click", closeSidebar);

document.getElementById("newChatBtn").addEventListener(
  "click", createChat
);

/* SEARCH */

searchInput.addEventListener("input", renderHistory);

/* DISPLAY HISTORY */

function renderHistory() {
  const query = searchInput.value.toLowerCase().trim();

  historyList.innerHTML = "";

  chats.forEach(chat => {
    const searchableText =
      chat.title + " " +
      chat.messages.map(m => m.content).join(" ");

    if (!searchableText.toLowerCase().includes(query)) {
      return;
    }

    const item = document.createElement("div");
    item.className =
      "chat-item" + (chat.id === currentChatId ? " active" : "");

    const title = document.createElement("div");
    title.className = "chat-title";
    title.textContent = chat.title;
    title.addEventListener("click", () => switchChat(chat.id));

    const actions = document.createElement("div");
    actions.className = "chat-actions";

    const rename = document.createElement("button");
    rename.textContent = "✎";
    rename.title = "Rename";
    rename.addEventListener("click", () => renameChat(chat.id));

    const remove = document.createElement("button");
    remove.textContent = "×";
    remove.title = "Delete";
    remove.addEventListener("click", () => deleteChat(chat.id));

    actions.append(rename, remove);
    item.append(title, actions);
    historyList.appendChild(item);
  });
}

/* DISPLAY MESSAGES */

function render() {
  const chat = currentChat();
  if (!chat) return;

  messages.innerHTML = "";

  if (chat.messages.length === 0) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const logo = document.createElement("img");
    logo.src = "./icon-192.png";
    logo.alt = "Sylvie AI";
    logo.onerror = () => logo.style.display = "none";

    const heading = document.createElement("h1");
    heading.textContent = "What can I help with?";

    const paragraph = document.createElement("p");
    paragraph.textContent =
      "Ask Sylvie anything. You can chat in English, Hindi, or Odia.";

    welcome.append(logo, heading, paragraph);
    messages.appendChild(welcome);

  } else {
    chat.messages.forEach((message, index) => {
      addMessageElement(message, index);
    });
  }

  renderHistory();
  scrollToBottom();
}

/* CREATE MESSAGE ELEMENT */

function addMessageElement(message, index) {
  const wrapper = document.createElement("div");
  wrapper.className = "message " + message.role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = message.content;

  wrapper.appendChild(bubble);

  if (message.role === "assistant") {
    const tools = document.createElement("div");
    tools.className = "message-tools";

    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.addEventListener("click", () => {
      copyText(message.content);
    });

    tools.appendChild(copy);

    const chat = currentChat();

    if (index === chat.messages.length - 1) {
      const regenerate = document.createElement("button");
      regenerate.textContent = "Regenerate";
      regenerate.addEventListener("click", regenerateReply);
      tools.appendChild(regenerate);
    }

    wrapper.appendChild(tools);
  }

  messages.appendChild(wrapper);
}

/* COPY */

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    alert("Copied!");
  } catch (error) {
    const temp = document.createElement("textarea");
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    temp.remove();
    alert("Copied!");
  }
}

/* LANGUAGE */

function languageInstruction() {
  const language = languageSelect.value;

  if (language === "auto") {
    return "Reply in the same language as the user's latest message.";
  }

  if (language === "Hindi") {
    return "Please reply in Hindi.";
  }

  if (language === "Odia") {
    return "Please reply in Odia.";
  }

  return "Please reply in English.";
}

/* ADD MESSAGE */

function addMessage(role, content) {
  const chat = currentChat();
  if (!chat) return;

  chat.messages.push({
    role,
    content
  });

  chat.updated = Date.now();

  if (chat.messages.length === 1 && role === "user") {
    chat.title = content.slice(0, 35);
    if (content.length > 35) chat.title += "...";
  }

  saveChats();
}

/* SCROLL */

function scrollToBottom() {
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  });
}

/* SEND MESSAGE */

async function sendMessage(existingText = null, isRegenerate = false) {
  if (isSending) return;

  const text = (existingText ?? messageInput.value).trim();

  if (!text) return;

  const chat = currentChat();
  if (!chat) return;

  if (!isRegenerate) {
    addMessage("user", text);
    messageInput.value = "";
    messageInput.style.height = "auto";
  }

  isSending = true;
  sendBtn.disabled = true;

  render();

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "Sylvie is thinking...";
  messages.appendChild(typing);

  scrollToBottom();

  try {
    const latestChat = currentChat();

    const history = latestChat.messages
      .slice(0, -1)
      .slice(-12)
      .map(item => ({
        role: item.role,
        content: item.content
      }));

    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text + "\n\n" + languageInstruction(),
        history: history
      })
    });

    if (!response.ok) {
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();

    if (!data.reply) {
      throw new Error("The server returned no reply.");
    }

    addMessage("assistant", data.reply);

  } catch (error) {
    console.error("Sylvie error:", error);

    addMessage(
      "assistant",
      "Sorry, I couldn't connect to Sylvie's AI server. Please check your internet connection and try again.\n\nError: " +
      error.message
    );

  } finally {
    isSending = false;
    sendBtn.disabled = false;
    render();
  }
}

/* REGENERATE */

function regenerateReply() {
  const chat = currentChat();
  if (!chat || isSending) return;

  const lastAssistant = chat.messages[chat.messages.length - 1];

  if (!lastAssistant || lastAssistant.role !== "assistant") {
    return;
  }

  chat.messages.pop();

  const lastUser = [...chat.messages]
    .reverse()
    .find(item => item.role === "user");

  saveChats();
  render();

  if (lastUser) {
    sendMessage(lastUser.content, true);
  }
}

/* SEND BUTTON */

sendBtn.addEventListener("click", () => {
  sendMessage();
});

/* ENTER TO SEND */

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

/* AUTO-RESIZE INPUT */

messageInput.addEventListener("input", () => {
  messageInput.style.height = "auto";
  messageInput.style.height =
    Math.min(messageInput.scrollHeight, 140) + "px";
});

/* SERVICE WORKER */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => console.log("Service worker:", error));
  });
}

/* START APP */

loadChats();

</script>

</body>
  </html>
