<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171522">
<meta name="description" content="Sylvie AI — your thoughtful multilingual AI companion.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sylvie AI 💜</title>
<style>
:root{color-scheme:dark;--bg:#000000;--panel:#111111;--panel2:#202020;--text:#ffffff;--muted:#b8b8b8;--purple:#ffffff;--line:#383838}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{width:290px;flex:0 0 290px;background:#191625;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px;z-index:5}
.brand{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px}.brand strong{font-size:19px;color:#ffffff}
.newchat,.side-action{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;text-align:left}
.search{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px}
.history-label{color:var(--muted);font-size:12px;padding:4px 5px 0}.history{overflow:auto;flex:1;display:flex;flex-direction:column;gap:5px}
.chat-item{display:flex;align-items:center;gap:6px;border-radius:10px;padding:8px;background:transparent}
.chat-item.active,.chat-item:hover{background:var(--panel2)}.chat-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:none;border:0;color:var(--text);padding:3px}
.icon-btn{background:transparent;border:0;color:var(--muted);padding:6px;border-radius:8px}.icon-btn:hover{background:#444444;color:white}
.side-bottom{border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:12px}
.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100dvh}
.topbar{height:58px;flex:0 0 58px;background:var(--panel);display:flex;align-items:center;gap:12px;padding:0 15px;border-bottom:1px solid var(--line)}
.menu-btn{background:none;border:0;color:var(--text);font-size:22px;padding:5px}.top-title{font-weight:650;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.language{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:7px;border-radius:9px;max-width:120px}
.chat-area{flex:1;overflow-y:auto;padding:22px 16px 16px;scroll-behavior:smooth}
.messages{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:17px}
.welcome{text-align:center;margin:auto;padding:10vh 12px 4vh;max-width:600px}.welcome h1{font-size:30px;color:#ffffff;margin:0 0 8px}.welcome p{color:var(--muted)}
.msg{display:flex;gap:10px;align-items:flex-start}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:#333333;color:#ffffff;font-size:13px}
.bubble{min-width:0;max-width:calc(100% - 40px);padding:12px 15px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel2)}
.msg.user{justify-content:flex-end}.msg.user .avatar{order:2;background:#303030}.msg.user .bubble{background:#303030}
.msg-tools{display:flex;gap:5px;margin-top:5px}.msg-tools button{font-size:12px;color:var(--muted);background:transparent;border:0;padding:4px 7px}
.composer-wrap{padding:10px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 18%)}
.composer{max-width:820px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:9px;display:flex;align-items:flex-end;gap:8px}
#message{resize:none;min-height:42px;max-height:150px;flex:1;background:transparent;border:0;outline:0;color:var(--text);padding:9px}
.send{background:#ffffff;border:0;color:#000000;border-radius:12px;padding:10px 15px;font-weight:600}.send:disabled{opacity:.5}
.hint{text-align:center;color:#999999;font-size:11px;padding-top:6px}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:4}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}
@media(max-width:720px){.sidebar{position:fixed;inset:0 auto 0 0;height:100dvh;transform:translateX(-105%);transition:transform .22s ease;box-shadow:15px 0 45px #0007}.sidebar.open{transform:translateX(0)}.overlay.show{display:block}.topbar{padding:0 10px}.chat-area{padding:16px 12px}.welcome{padding-top:12vh}.language{max-width:105px}}
@media(min-width:721px){.menu-btn{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><strong>💜 Sylvie AI</strong><button class="icon-btn" id="closeSidebar" aria-label="Close menu">✕</button></div>
    <button class="newchat" id="newChat">＋ New chat</button>
    <input class="search" id="search" type="search" placeholder="Search chats...">
    <div class="history-label">YOUR CONVERSATIONS</div>
    <div class="history" id="history"></div>
    <div class="side-bottom">Chats are saved on this device. Clearing browser data may erase them.</div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="top-title" id="topTitle">New chat</div>
      <select class="language" id="language" aria-label="Response language">
        <option value="auto">Auto language</option><option value="en">English</option><option value="hi">हिन्दी</option><option value="or">ଓଡ଼ିଆ</option>
      </select>
    </header>
    <section class="chat-area" id="chatArea">
      <div class="messages" id="messages"></div>
    </section>
    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="message" rows="1" placeholder="Message Sylvie..." required></textarea>
        <button class="send" id="send" type="submit">Send</button>
      </form>
      <div class="hint">Sylvie can make mistakes. Check important information.</div>
    </div>
  </main>
</div>
<script>
const API = "https://sylvie-ai-backend.ronitklenka.workers.dev";
const STORAGE_KEY = "sylvie_chats_v1";
const $ = id => document.getElementById(id);
let chats = loadChats();
let activeId = chats[0]?.id || null;
let busy = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function loadChats(){ try { const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); return Array.isArray(x)?x:[]; } catch { return []; } }
function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(chats)); }
function activeChat(){ return chats.find(c=>c.id===activeId); }
function makeChat(){ const c={id:uid(),title:"New chat",created:Date.now(),updated:Date.now(),language:$("language").value,messages:[]};chats.unshift(c);activeId=c.id;save();render();closeMenu();$("message").focus(); }
function closeMenu(){ $("sidebar").classList.remove("open");$("overlay").classList.remove("show"); }
function openMenu(){ $("sidebar").classList.add("open");$("overlay").classList.add("show"); }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderHistory(){
 const q=$("search").value.toLowerCase(); const box=$("history");box.innerHTML="";
 const filtered=chats.filter(c=>(c.title||"").toLowerCase().includes(q)||c.messages.some(m=>m.content.toLowerCase().includes(q)));
 if(!filtered.length){box.innerHTML='<div class="empty">No conversations found</div>';return;}
 filtered.forEach(c=>{
  const row=document.createElement("div");row.className="chat-item"+(c.id===activeId?" active":"");
  const title=document.createElement("button");title.className="chat-title";title.textContent=c.title||"New chat";title.onclick=()=>{activeId=c.id;render();closeMenu();};
  const more=document.createElement("button");more.className="icon-btn";more.textContent="⋯";more.title="Chat options";
  more.onclick=()=>{const action=prompt("Type: rename or delete");if(action==="rename"){const n=prompt("New conversation name",c.title);if(n&&n.trim()){c.title=n.trim().slice(0,80);save();render();}}else if(action==="delete"){if(confirm("Delete this conversation?")){chats=chats.filter(x=>x.id!==c.id);if(activeId===c.id)activeId=chats[0]?.id||null;save();render();}}};
  row.append(title,more);box.append(row);
 });
}
function addMessageNode(m,index){
 const row=document.createElement("div");row.className="msg "+(m.role==="user"?"user":"ai");
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=m.role==="user"?"You":"S";
 const wrap=document.createElement("div");wrap.style.minWidth="0";
 const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=m.content;wrap.append(bubble);
 if(m.role==="assistant"){
  const tools=document.createElement("div");tools.className="msg-tools";
  const copy=document.createElement("button");copy.textContent="Copy";copy.onclick=()=>navigator.clipboard?.writeText(m.content).then(()=>copy.textContent="Copied").catch(()=>{copy.textContent="Select to copy";});
  tools.append(copy);
  const c=activeChat();
  if(c && index===c.messages.length-1 && c.messages.length>=2 && c.messages[c.messages.length-2].role==="user"){
    const again=document.createElement("button");again.textContent="Regenerate";again.onclick=()=>{const lastUser=c.messages[c.messages.length-2].content;c.messages.pop();save();render();sendMessage(lastUser,true);};
    tools.append(again);
  }
  wrap.append(tools);
 }
 row.append(avatar,wrap);$("messages").append(row);
}
function render(){
 renderHistory();const c=activeChat();$("messages").innerHTML="";
 $("topTitle").textContent=c?.title||"New chat";
 if(!c||!c.messages.length){const w=document.createElement("div");w.className="welcome";w.innerHTML="<h1 style="color:#fff">What can I help with?</h1><p>Ask Sylvie anything. You can chat in English, Hindi, or Odia.</p>";$("messages").append(w);}
 else c.messages.forEach(addMessageNode);
 $("chatArea").scrollTop=$("chatArea").scrollHeight;
}
function languageInstruction(){
 const v=$("language").value;
 return v==="hi"?"Respond in Hindi.":v==="or"?"ଓଡ଼ିଆରେ ଉତ୍ତର ଦିଅ।":v==="en"?"Respond in English.":"Respond in the same language as the user's latest message.";
}
async function sendMessage(text,regenerate=false){
 const c=activeChat()|| (makeChat(),activeChat());if(busy)return;
 if(!regenerate){c.messages.push({role:"user",content:text});if(c.title==="New chat"){c.title=text.slice(0,42)+(text.length>42?"…":"");}}
 c.updated=Date.now();save();render();
 busy=true;$("send").disabled=true;
 const pending=document.createElement("div");pending.className="msg ai";pending.innerHTML='<div class="avatar">S</div><div class="bubble">Sylvie is thinking… 💜</div>';$("messages").append(pending);$("chatArea").scrollTop=$("chatArea").scrollHeight;
 try{
  const history=c.messages.slice(0,-1).slice(-12).map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.content}));
  const latest=c.messages[c.messages.length-1]?.content||text;
  const response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:latest+"\n\n"+languageInstruction(),history})});
  const data=await response.json();if(!response.ok)throw new Error(data.error||"Request failed");
  c.messages.push({role:"assistant",content:data.reply||"I couldn't create a reply."});c.updated=Date.now();save();
  pending.remove();render();
 }catch(e){pending.querySelector(".bubble").textContent="I couldn't connect just now. Please try again. 💜";console.error(e);}
 finally{busy=false;$("send").disabled=false;$("message").focus();}
}
$("form").addEventListener("submit",e=>{e.preventDefault();const v=$("message").value.trim();if(!v||busy)return;$("message").value="";$("message").style.height="auto";sendMessage(v);});
$("message").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px";});
$("newChat").onclick=makeChat;$("menuBtn").onclick=openMenu;$("closeSidebar").onclick=closeMenu;$("overlay").onclick=closeMenu;$("search").oninput=renderHistory;
$("language").onchange=()=>{const c=activeChat();if(c){c.language=$("language").value;save();}};
if(!activeId)makeChat();else render();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));}
</script>
</body>
</html>
